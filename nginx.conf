server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the GitHub Pages output layout: the generated app is served from the
    # root with a static HTML shell and adjacent wasm/assets.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep static files cacheable while making the app shell load fresh when the
    # build changes.
    location ~* \.(?:js|css|wasm|data|json|png|jpg|jpeg|svg|ico|webmanifest|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
